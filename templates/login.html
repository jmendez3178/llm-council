<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BooksAI — Sign In</title>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#7d8590;--accent:#10b981;--expense:#f85149}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;max-width:95vw}
  .logo{width:44px;height:44px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#000;margin:0 auto 20px}
  h1{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
  .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px}
  label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
  input{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;padding:9px 12px;outline:none;transition:border-color .15s;margin-bottom:14px}
  input:focus{border-color:var(--accent)}
  .btn{width:100%;background:var(--accent);color:#000;font-weight:700;font-size:14px;padding:10px;border:none;border-radius:7px;cursor:pointer;margin-top:4px;transition:opacity .15s}
  .btn:hover{opacity:.88}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .error{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4);border-radius:7px;color:var(--expense);font-size:13px;padding:10px 12px;margin-bottom:16px;display:none}
  .error.show{display:block}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .footer{text-align:center;margin-top:22px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">B</div>
  <h1>Welcome to BooksAI</h1>
  <p class="sub">AI-powered bookkeeping for your business</p>

  <div class="error" id="errBox"></div>

  <label for="email">Email address</label>
  <input type="email" id="email" placeholder="you@company.com" autocomplete="email" autofocus>

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button class="btn" id="signInBtn" onclick="signIn()">Sign In</button>

  <p class="footer">Powered by Claude AI &nbsp;·&nbsp; BooksAI</p>
</div>

<script>
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') signIn();
});

async function signIn() {
  const btn   = document.getElementById('signInBtn');
  const errBox = document.getElementById('errBox');
  const email  = document.getElementById('email').value.trim();
  const pw     = document.getElementById('password').value;

  errBox.classList.remove('show');
  if (!email || !pw) { showErr('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';

  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password: pw})
    });
    const data = await r.json();
    if (r.ok) {
      window.location.href = '/';
    } else {
      showErr(data.error || 'Sign in failed.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch(e) {
    showErr('Network error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function showErr(msg) {
  const b = document.getElementById('errBox');
  b.textContent = msg;
  b.classList.add('show');
}
</script>
</body>
</html>
